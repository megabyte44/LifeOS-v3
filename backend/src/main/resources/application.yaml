server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: LifeOS-backend
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: optional:file:.env[.properties],optional:file:./backend/.env[.properties]

  # ── PostgreSQL Datasource (primary: AWS RDS; backup: Neon) ──
  datasource:
    url: ${SPRING_DATASOURCE_URL:${NEON_DATASOURCE_URL:${LOCAL_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT_HOST:5432}/${POSTGRES_DB:lifeos}}}}
    username: ${SPRING_DATASOURCE_USERNAME:${NEON_DATASOURCE_USERNAME:${LOCAL_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${NEON_DATASOURCE_PASSWORD:${LOCAL_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema; Hibernate only validates
    show-sql: false                # Handled by logback (org.hibernate.SQL logger)
    open-in-view: false            # Best practice: avoid lazy-loading in controllers

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── Firebase ──
firebase:
  service-account-path: classpath:firebase-service-account.json

# ── Encryption ──
encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:YpBF7EZwmKRB75WR2czHQSMaD3jOg4fVsui2Ip1ld+I=}

# ── VAPID (Web Push) ──
vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: "mailto:admin@lifeos.app"

# ── Logging — detailed config in logback-spring.xml ──
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO

ai:
  provider: ${AI_PROVIDER:}
  model: ${AI_MODEL:}
  openai-api-key: ${OPENAI_API_KEY:}
  openrouter-api-key: ${OPENROUTER_API_KEY:}
  openrouter-embedding-api-key: ${OPENROUTER_EMBEDDING_API_KEY:${OPENROUTER_API_KEY:}}
  gemini-api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
  embedding:
    dimensions: 1536
    max-input-chars: 24000
  streaming:
    connect-timeout: 10s
    response-timeout: 120s
  rag:
    default-vector-limit: 5
    max-context-chunks: 5
    enable-hybrid-reads: ${MEMORY_HYBRID_READS:true}
    enable-dynamic-top-k: ${MEMORY_DYNAMIC_TOPK:true}
    enable-conversation-memory-embeddings: ${MEMORY_CONVO_EMBEDDINGS:true}
    # KG-RAG flags
    enable-universal-embedding: ${RAG_UNIVERSAL_EMBEDDING:true}
    enable-knowledge-graph: ${RAG_KNOWLEDGE_GRAPH:true}
    enable-edge-extraction: ${RAG_EDGE_EXTRACTION:true}
    enable-query-intent-classification: ${RAG_QUERY_INTENT:true}
    enable-graph-boosted-scoring: ${RAG_GRAPH_BOOST:true}
    enabled-source-types: []
    graph-max-hops: 2
    graph-boost-weight: 0.15
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100
    thread-name-prefix: ai-
  insights:
    cron: ${AI_INSIGHTS_CRON:0 0 20 * * *}

---
spring:
  config:
    activate:
      on-profile: development
  datasource:
    url: ${LOCAL_DATASOURCE_URL}
    username: ${LOCAL_DATASOURCE_USERNAME}
    password: ${LOCAL_DATASOURCE_PASSWORD}
