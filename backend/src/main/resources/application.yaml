server:
  port: 8000

spring:
  application:
    name: LifeOS-backend
  config:
    import: optional:file:.env[.properties],optional:file:./backend/.env[.properties]

  # ── PostgreSQL Datasource (Neon.tech) ──
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-proud-glade-a4sn6exq-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_qUsA6mOMGiE4}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema; Hibernate only validates
    show-sql: true                 # Log SQL statements (disable in production)
    open-in-view: false            # Best practice: avoid lazy-loading in controllers
    properties:
      hibernate:
        format_sql: true
        # dialect is auto-detected by Hibernate 7 — no need to specify

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── Firebase ──
firebase:
  service-account-path: classpath:firebase-service-account.json

# ── Encryption ──
encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:YpBF7EZwmKRB75WR2czHQSMaD3jOg4fVsui2Ip1ld+I=}

# ── VAPID (Web Push) ──
vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: "mailto:admin@lifeos.app"

# ── Logging ──
logging:
  level:
    com.lifos.backend: DEBUG
    org.springframework.security: DEBUG

ai:
  embedding:
    provider: openai
    model: text-embedding-3-small
    base-url: https://api.openai.com/v1
    api-key: ${OPENAI_API_KEY:}
    dimensions: 1536
    max-input-chars: 24000
  streaming:
    connect-timeout: 10s
    response-timeout: 120s
  rag:
    default-vector-limit: 5
    max-context-chunks: 5
  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
    thread-name-prefix: ai-
