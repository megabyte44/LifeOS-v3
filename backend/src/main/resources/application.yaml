server:
  port: 8000

spring:
  application:
    name: LifeOS-backend

  # ── PostgreSQL Datasource ──
  datasource:
    url: jdbc:postgresql://localhost:5432/lifeos
    username: postgres
    password: 365210
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema; Hibernate only validates
    show-sql: true                 # Log SQL statements (disable in production)
    open-in-view: false            # Best practice: avoid lazy-loading in controllers
    properties:
      hibernate:
        format_sql: true
        # dialect is auto-detected by Hibernate 7 — no need to specify

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── Firebase ──
# Download your service account JSON from:
#   Firebase Console → Project Settings → Service Accounts → Generate new private key
# Save it as: src/main/resources/firebase-service-account.json
firebase:
  service-account-path: classpath:firebase-service-account.json

# ── Encryption ──
# AES-256-GCM key for credential vault encryption.
# IMPORTANT: Keep this secret — rotate if compromised.
encryption:
  secret-key: YpBF7EZwmKRB75WR2czHQSMaD3jOg4fVsui2Ip1ld+I=

# ── VAPID (Web Push) ──
# Generate VAPID keys: npx web-push generate-vapid-keys
# Set these values, and also set NEXT_PUBLIC_VAPID_PUBLIC_KEY in frontend .env.local
vapid:
  public-key: ""
  private-key: ""
  subject: "mailto:admin@lifeos.app"

# ── Logging ──
logging:
  level:
    com.lifos.backend: DEBUG
    org.springframework.security: DEBUG
