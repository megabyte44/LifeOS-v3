[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
loglevel=info

; ── nginx ─────────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-err.log

; ── Spring Boot backend ───────────────────────────────────────────
; Inherits all env vars from the container (DB URL, API keys, etc.)
[program:backend]
command=java -Xms128m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -jar /app/backend.jar
autostart=true
autorestart=true
priority=20
startretries=3
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend-err.log

; ── Next.js frontend ──────────────────────────────────────────────
; Uses the standalone server.js produced by `next build`
[program:frontend]
command=node /app/frontend/server.js
autostart=true
autorestart=true
priority=30
startretries=3
stdout_logfile=/var/log/supervisor/frontend.log
stderr_logfile=/var/log/supervisor/frontend-err.log
